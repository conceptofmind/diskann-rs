[package]
name = "pydiskann"
version = "0.5.2"
edition = "2021"

[lib]
name = "diskann_py"
crate-type = ["cdylib"]

[dependencies]
diskann = { package = "diskann-rs", path = ".." }
anndists = { version = "0.1.3", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
rayon = "1"
